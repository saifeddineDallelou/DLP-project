name: CI

# Three jobs on two platforms, which is not gratuitous:
#
#   backend    ubuntu  -- needs a PostgreSQL service container, and those are
#                         Linux-only on GitHub Actions
#   classifier ubuntu  -- a stateless microservice; Linux is where it would
#                         actually be deployed
#   agent      windows -- genuinely Windows-bound. It imports ctypes.wintypes,
#                         pywinauto and tkinter, and monitors Win32 windows and
#                         clipboard formats. It cannot import on Linux at all.
#
# They run in parallel and are independent: a Windows-only agent failure does
# not hide a backend regression.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run -- no point paying for
# results nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: [ubuntu-latest]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dlp_db_test
        ports:
          - 5432:5432
        # Without this the job races the container: Actions reports the
        # service "started" before Postgres is accepting connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Prisma 7 requires ^20.19 || ^22.12 || >=24, and @prisma/streams-local
          # requires >=22 outright -- Node 20 cannot satisfy it at all. 24 also
          # matches what the project is developed against, so CI and a developer
          # machine agree.
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Write test environment
        working-directory: backend
        # tests/setupEnv.js loads .env.test and refuses to run unless
        # DATABASE_URL names dlp_db_test -- a guard against ever pointing the
        # suite at a real database, since resetDb() truncates every table.
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/dlp_db_test"
          JWT_SECRET="ci-jwt-secret-not-for-production"
          JWT_ACCESS_EXPIRY="15m"
          JWT_REFRESH_EXPIRY="7d"
          PORT=3001
          NODE_ENV=test
          CORS_ORIGIN=http://localhost:5173
          CLASSIFIER_URL=http://127.0.0.1:8000
          EVIDENCE_ENCRYPTION_KEY="ci-aes-256-encryption-key-32char"
          SIEM_MODE=off
          EOF

      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dlp_db_test
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dlp_db_test
        run: npx prisma generate

      - name: Test
        working-directory: backend
        run: npm test

  classifier:
    name: classifier
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: classifier/requirements.txt

      - name: Install libmagic
        # The OS library behind python-magic. engine.py degrades without it,
        # but file-type detection is part of what the suite covers.
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install dependencies
        working-directory: classifier
        run: pip install -r requirements.txt

      - name: Test
        working-directory: classifier
        run: python -m pytest -q

  agent:
    name: agent (windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        working-directory: agent
        run: pip install -r requirements.txt

      - name: Test
        working-directory: agent
        # pytest.ini sets pythonpath=src, so the modules import as the agent
        # itself imports them.
        run: python -m pytest -q

  frontend:
    name: frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        # No test suite here yet. A build failure is still worth catching --
        # a broken import or bad JSX would otherwise reach main unnoticed.
        working-directory: frontend
        run: npm run build
